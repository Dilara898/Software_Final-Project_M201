services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: researcher
      POSTGRES_PASSWORD: researcher
      POSTGRES_DB: researcher
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./researcher/storage/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researcher"]
      interval: 3s
      retries: 10

  app:
    build: .
    # Optional: a clean clone has no .env (it is gitignored). Without
    # `required: false` compose aborts before the container starts, so
    # `docker compose run --rm app ...` would fail on a fresh checkout.
    # Copy .env.example to .env to supply real provider keys.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://researcher:researcher@db:5432/researcher
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: